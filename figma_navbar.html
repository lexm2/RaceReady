<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #131516;
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* ── Navbar bar ── */
  .navbar {
    width: 1200px;
    height: 64px;
    background: rgba(19, 21, 22, 0.92);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    display: flex;
    align-items: center;
    padding: 0 32px;
    gap: 32px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex-shrink: 0;
  }

  .burgee {
    width: 32px;
    height: 32px;
    background: #FFCB05;
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }

  .brand-name {
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: -0.02em;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: rgba(255,255,255,0.75);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  .nav-btn.active {
    background: rgba(255,255,255,0.08);
    color: #FFFFFF;
  }

  .chevron {
    width: 10px;
    height: 10px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    margin-top: -3px;
    opacity: 0.6;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .theme-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    color: rgba(255,255,255,0.6);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
  }

  .play-btn {
    padding: 8px 20px;
    background: #FFCB05;
    border: none;
    border-radius: 6px;
    color: #131516;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ── Dropdown panels ── */
  .dropdowns-row {
    display: flex;
    gap: 24px;
  }

  .dropdown-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 240px;
  }

  .dropdown-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0 4px;
  }

  .dropdown-panel {
    background: #00274C;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
  }

  .item-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .item-icon svg {
    width: 16px;
    height: 16px;
    stroke: rgba(255,255,255,0.5);
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .item-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #FFFFFF;
  }
</style>
</head>
<body>

  <!-- Navbar closed state -->
  <div class="navbar">
    <a class="brand" href="#">
      <div class="burgee"></div>
      <span class="brand-name">RaceReady</span>
    </a>
    <div class="nav-links">
      <button class="nav-btn active">Study <span class="chevron"></span></button>
      <button class="nav-btn">Resources <span class="chevron"></span></button>
      <button class="nav-btn">Games <span class="chevron"></span></button>
    </div>
    <div class="nav-actions">
      <button class="theme-btn">Dark</button>
      <button class="play-btn">Play Now</button>
    </div>
  </div>

  <!-- All three dropdowns open -->
  <div class="dropdowns-row">

    <div class="dropdown-wrap">
      <span class="dropdown-label">Study</span>
      <div class="dropdown-panel">
        <a class="dropdown-item" href="#">
          <span class="item-icon"><svg viewBox="0 0 24 24"><path d="M12 3L3 9v12h6v-6h6v6h6V9z"/></svg></span>
          <span class="item-label">Racing Rules</span>
        </a>
        <a class="dropdown-item" href="#">
          <span class="item-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="3" x2="12" y2="21"/><path d="M3 9h18M3 15h18"/></svg></span>
          <span class="item-label">Tactics & Strategy</span>
        </a>
        <a class="dropdown-item" href="#">
          <span class="item-icon"><svg viewBox="0 0 24 24"><path d="M3 17l4-8 3 5 3-3 4 6"/><path d="M3 20h18"/></svg></span>
          <span class="item-label">Boat Knowledge</span>
        </a>
        <a class="dropdown-item" href="#">
          <span class="item-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg></span>
          <span class="item-label">General Knowledge</span>
        </a>
        <a class="dropdown-item" href="#">
          <span class="item-icon"><svg viewBox="0 0 24 24"><path d="M12 3c0 0-6 4-6 10a6 6 0 0012 0c0-6-6-10-6-10z"/><line x1="12" y1="13" x2="12" y2="21"/></svg></span>
          <span class="item-label">Knots</span>
        </a>
      </div>
    </div>

    <div class="dropdown-wrap">
      <span class="dropdown-label">Resources</span>
      <div class="dropdown-panel">
        <a class="dropdown-item" href="#">
          <span class="item-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 012-2h13a1 1 0 011 1v13"/><path d="M4 19a2 2 0 002 2h13a1 1 0 001-1v-1"/><line x1="8" y1="8" x2="15" y2="8"/><line x1="8" y1="12" x2="15" y2="12"/></svg></span>
          <span class="item-label">Racing Rules of Sailing</span>
        </a>
        <a class="dropdown-item" href="#">
          <span class="item-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="12" y1="8" x2="12" y2="16"/></svg></span>
          <span class="item-label">Whiteboard</span>
        </a>
      </div>
    </div>

    <div class="dropdown-wrap">
      <span class="dropdown-label">Games</span>
      <div class="dropdown-panel">
        <a class="dropdown-item" href="#">
          <span class="item-icon"><svg viewBox="0 0 24 24"><polygon points="12 2 15 9 22 9 16 14 18 21 12 17 6 21 8 14 2 9 9 9"/></svg></span>
          <span class="item-label">Starboard Showdown</span>
        </a>
        <a class="dropdown-item" href="#">
          <span class="item-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg></span>
          <span class="item-label">Regatta Run</span>
        </a>
      </div>
    </div>

  </div>

</body>
</html>
